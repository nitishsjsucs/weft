name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:prose
      - run: pnpm lint:brand
      - run: pnpm brand:overlap
      - run: pnpm typecheck
      - run: pnpm test
        env:
          WEFT_LLM: scripted
      - run: pnpm --filter @weft/web build
